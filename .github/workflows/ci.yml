name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_APP_DATABASE_URL: postgres://owdms_app:owdms_app_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm --filter @owdms/web build
      - name: dependency audit (report only)
        run: pnpm audit --prod || true

  demo-image:
    # 공개 시연판 이미지가 빌드되고, 컨테이너 구성이 실제로 뜨는지 확인한다(caddy 제외).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t owdms:demo .
      - name: start demo stack with throwaway secrets
        run: |
          {
            echo DEMO_DOMAIN=localhost
            echo POSTGRES_PASSWORD=$(openssl rand -hex 24)
            echo APP_DB_PASSWORD=$(openssl rand -hex 24)
            echo SESSION_SECRET=$(openssl rand -base64 32)
            echo PII_ENCRYPTION_KEY=$(openssl rand -base64 32)
          } > infra/.env
          docker compose -f infra/compose.demo.yaml up -d --no-build db bootstrap api worker web
      - name: check services
        run: |
          # 화면과 API가 모두 응답할 때까지 기다린다(API는 web보다 늦게 뜰 수 있음).
          check() { docker compose -f infra/compose.demo.yaml exec -T web node -e "fetch('$1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; }
          ok=0
          for i in $(seq 1 60); do
            check http://localhost:3000/login && check http://api:4000/health && ok=1 && break
            sleep 2
          done
          docker compose -f infra/compose.demo.yaml logs bootstrap api worker
          test "$ok" = 1
          docker compose -f infra/compose.demo.yaml logs bootstrap | grep -q "demo seed inserted"
      - name: stop
        if: always()
        run: docker compose -f infra/compose.demo.yaml down -v

  prod-backup:
    # 운영 구성: 시연 기능이 꺼져 있는지, 매일 백업·복원 점검 스크립트가 실제로 도는지 확인한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t owdms:prod .
      - name: start prod stack with throwaway secrets
        run: |
          {
            echo OWDMS_DOMAIN=localhost
            echo POSTGRES_PASSWORD=$(openssl rand -hex 24)
            echo APP_DB_PASSWORD=$(openssl rand -hex 24)
            echo SESSION_SECRET=$(openssl rand -base64 32)
            echo PII_ENCRYPTION_KEY=$(openssl rand -base64 32)
            echo BACKUP_PASSPHRASE=$(openssl rand -hex 24)
            echo BACKUP_DIR=$RUNNER_TEMP/backups
            echo OWDMS_IMAGE=owdms:prod
          } > infra/.env
          mkdir -p $RUNNER_TEMP/backups
          docker compose -f infra/compose.prod.yaml up -d --no-build db bootstrap api worker web backup
      - name: check dev login disabled, backup and restore check
        run: |
          C="docker compose -f infra/compose.prod.yaml"
          check() { $C exec -T web node -e "fetch('$1',{method:'POST',headers:{'content-type':'application/json'},body:'{\"username\":\"x\"}'}).then(r=>process.exit(r.status===$2?0:1)).catch(()=>process.exit(1))"; }
          ok=0
          for i in $(seq 1 60); do
            check http://api:4000/v1/auth/dev-login 404 && ok=1 && break
            sleep 2
          done
          test "$ok" = 1
          $C run --rm --no-deps bootstrap ../../node_modules/.bin/tsx src/cli.ts create-admin ci1 "CI(가상)" ci.admin "CI관리자" > /dev/null
          $C exec -T backup sh /usr/local/bin/backup.sh once
          f=$(ls $RUNNER_TEMP/backups | grep '.dump.gpg$' | tail -1)
          $C exec -T backup sh /usr/local/bin/backup.sh verify /backups/$f | tee verify.txt
          grep -q "복원 점검 완료" verify.txt
      - name: stop
        if: always()
        run: docker compose -f infra/compose.prod.yaml down -v
