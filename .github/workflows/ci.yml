name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_APP_DATABASE_URL: postgres://owdms_app:owdms_app_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm --filter @owdms/web build
      - name: dependency audit (report only)
        run: pnpm audit --prod || true

  demo-image:
    # 공개 시연판 이미지가 빌드되고, 컨테이너 구성이 실제로 뜨는지 확인한다(caddy 제외).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t owdms:demo .
      - name: start demo stack with throwaway secrets
        run: |
          {
            echo DEMO_DOMAIN=localhost
            echo POSTGRES_PASSWORD=$(openssl rand -hex 24)
            echo APP_DB_PASSWORD=$(openssl rand -hex 24)
            echo SESSION_SECRET=$(openssl rand -base64 32)
            echo PII_ENCRYPTION_KEY=$(openssl rand -base64 32)
          } > infra/.env
          docker compose -f infra/compose.demo.yaml up -d --no-build db bootstrap api worker web
      - name: check services
        run: |
          for i in $(seq 1 30); do
            docker compose -f infra/compose.demo.yaml exec -T web node -e "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && ok=1 && break
            sleep 2
          done
          docker compose -f infra/compose.demo.yaml logs bootstrap api worker
          test "$ok" = 1
          docker compose -f infra/compose.demo.yaml logs bootstrap | grep -q "demo seed inserted"
          docker compose -f infra/compose.demo.yaml exec -T web node -e "fetch('http://api:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: stop
        if: always()
        run: docker compose -f infra/compose.demo.yaml down -v
